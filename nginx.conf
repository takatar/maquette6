server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Sonde de santé utilisée par Docker / Coolify
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fichiers compilés par Vite (noms hachés) : cache long et immuable
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Photographies de la résidence
    location ^~ /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # Pages HTML pré-rendues :
    #   /                -> /index.html
    #   /presentation    -> /presentation/index.html
    #   /presentation.html -> /presentation.html
    # Toute autre URL retombe sur index.html (route React Router attrape-tout)
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri.html =404;
        # URL inconnue : on renvoie index.html avec un statut 404 (le routeur
        # React redirige ensuite vers l'accueil), pour éviter les soft 404 SEO.
        error_page 404 /index.html;
    }
}
